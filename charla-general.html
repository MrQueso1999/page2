<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charla General - Corporación Culo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos adicionales específicos para el diseño del chat dentro de tu estructura */
        .chat-container-box {
            background: rgba(31, 40, 51, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .chat-header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-gold);
            font-size: 0.95rem;
            font-weight: 600;
        }

        #chatBox {
            height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message-row .avatar {
            background-color: #1f2833;
            color: var(--text-gold);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }

        .message-row.user-me .avatar {
            background-color: var(--accent-red);
            color: #ffffff;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 8px;
            flex: 1;
        }

        .msg-user {
            font-size: 0.85rem;
            color: var(--text-gold);
            font-weight: bold;
            margin-bottom: 4px;
        }

        .msg-text {
            color: #cbd5e0;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .msg-time {
            font-size: 0.75rem;
            color: #a0aec0;
            display: block;
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .btn-send {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-send:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Corp. Culo</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">General</a></li>
                <li><a href="noticias.html" class="nav-link">Noticias</a></li>
                <li><a href="foro.html" class="nav-link">Foros</a></li>
                <li><a href="charla-general.html" class="nav-link active">Charla</a></li>
                <li><a href="ayuda.html" class="nav-link">Ayuda</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div>
            <h1>Charla General</h1>
            <p class="subtitle">Sala de debate en vivo</p>
        </div>

        <div class="chat-container-box">
            <div class="chat-header-status">
                <span>Conectados en este momento: <strong id="onlineCount" style="color: #ffffff;">0</strong></span>
                <span id="currentUserDisplay" style="font-size: 0.85rem; color: #a0aec0;"></span>
            </div>

            <div id="chatBox">
                <!-- Los mensajes se cargarán dinámicamente aquí -->
            </div>

            <form class="chat-input-area" id="chatForm" onsubmit="enviarMensaje(event); return false;">
                <input type="text" class="chat-input" id="chatInput" placeholder="Escribe un mensaje..." autocomplete="off" required>
                <button type="submit" class="btn-send">Enviar</button>
            </form>
        </div>

        <footer class="footer-links">
            <a href="#">Términos de Servicio</a> · 
            <a href="#">Política de Privacidad</a>
        </footer>
    </main>

    <!-- Script de Sincronización y Gestión de Usuario por 24 horas -->
    <script>
        const chatBox = document.getElementById('chatBox');

        // --- GESTIÓN DE USUARIO (Expira en 24 horas) ---
        function obtenerUsuario() {
            const storedData = localStorage.getItem('chat_user_session_24h');
            const now = new Date().getTime();
            const EXPIRATION_TIME = 24 * 60 * 60 * 1000; // 24 horas en milisegundos

            if (storedData) {
                const parsed = JSON.parse(storedData);
                // Si no han pasado 24 horas, reutilizamos el nombre
                if (now - parsed.timestamp < EXPIRATION_TIME) {
                    return parsed.username;
                }
            }

            // Si no existe o ya expiró, salta el pop-up (prompt)
            let username = prompt("¿Cuál sería tu nombre de usuario para las próximas 24 horas en Charla General?");
            if (!username || username.trim() === "") {
                username = "Anónimo_" + Math.floor(1000 + Math.random() * 9000);
            } else {
                username = username.trim();
            }

            // Guardamos el nombre junto con la hora actual
            localStorage.setItem('chat_user_session_24h', JSON.stringify({
                username: username,
                timestamp: now
            }));

            return username;
        }

        const miNombreUsuario = obtenerUsuario();
        
        // Mostrar en pantalla qué usuario está activo
        document.getElementById('currentUserDisplay').textContent = `Tu usuario: ${miNombreUsuario}`;

        window.onload = function() {
            actualizarChat();
            // Polling cada 0.5 segundos (500 milisegundos)
            setInterval(actualizarChat, 500);
        };

        // --- FUNCIÓN DE POLLING (Consulta a PHP cada 0.5s) ---
        async function actualizarChat() {
            try {
                const response = await fetch(`api.php?action=poll&username=${encodeURIComponent(miNombreUsuario)}`);
                const data = await response.json();

                // Actualizar contador de usuarios conectados
                const onlineCountElem = document.getElementById('onlineCount');
                if (onlineCountElem) {
                    onlineCountElem.textContent = data.active_users;
                }

                // Renderizar los mensajes devueltos por el servidor
                chatBox.innerHTML = '';
                data.messages.forEach(msg => {
                    const nuevoMensaje = document.createElement('div');
                    
                    if (msg.username === miNombreUsuario) {
                        nuevoMensaje.className = 'message-row user-me';
                        nuevoMensaje.innerHTML = `
                            <div class="avatar">TÚ</div>
                            <div class="message-content">
                                <div class="msg-user">${msg.username}</div>
                                <div class="msg-text">${msg.texto}</div>
                                <span class="msg-time">${msg.hora}</span>
                            </div>
                        `;
                    } else {
                        nuevoMensaje.className = 'message-row';
                        nuevoMensaje.innerHTML = `
                            <div class="avatar">USER</div>
                            <div class="message-content">
                                <div class="msg-user">${msg.username}</div>
                                <div class="msg-text">${msg.texto}</div>
                                <span class="msg-time">${msg.hora}</span>
                            </div>
                        `;
                    }
                    chatBox.appendChild(nuevoMensaje);
                });

                // Mantener el scroll al fondo si el usuario está leyendo lo último
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.error("Error sincronizando con el servidor:", err);
            }
        }

        // --- ENVIAR MENSAJE AL SERVIDOR PHP ---
        async function enviarMensaje(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('chatInput');
            const texto = input.value.trim();
            
            if (texto === "") return false;

            const formData = new FormData();
            formData.append('action', 'send');
            formData.append('username', miNombreUsuario);
            formData.append('message', texto);

            input.value = "";

            await fetch('api.php', {
                method: 'POST',
                body: formData
            });

            actualizarChat();
            return false;
        }
    </script>
</body>
</html>
